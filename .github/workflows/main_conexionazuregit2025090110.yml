name: Deploy static website to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir deploy
          cp -r public_html/* deploy/

          cat > deploy/server.js <<'EOF'
          const http = require('http');
          const fs = require('fs');
          const path = require('path');

          const port = process.env.PORT || 8080;

          const mimeTypes = {
            '.html': 'text/html',
            '.css': 'text/css',
            '.js': 'application/javascript',
            '.json': 'application/json',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.jpeg': 'image/jpeg',
            '.gif': 'image/gif',
            '.svg': 'image/svg+xml',
            '.ico': 'image/x-icon'
          };

          const server = http.createServer((req, res) => {
            let filePath = path.join(__dirname, req.url === '/' ? 'index.html' : req.url);

            if (!filePath.startsWith(__dirname)) {
              res.writeHead(403);
              res.end('Forbidden');
              return;
            }

            fs.readFile(filePath, (err, data) => {
              if (err) {
                res.writeHead(404);
                res.end('Not found');
                return;
              }

              const ext = path.extname(filePath);
              res.writeHead(200, {
                'Content-Type': mimeTypes[ext] || 'application/octet-stream'
              });
              res.end(data);
            });
          });

          server.listen(port, '0.0.0.0', () => {
            console.log(`Server running on port ${port}`);
          });
          EOF

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_600011E700F74E488BC5536464934BE9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_232BA62BB9094A059A628D4665B0A692 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0F670200A29D425DA6F619A91F8D7A90 }}

      - name: Configure startup command
        run: |
          az webapp config set \
            --resource-group practicaWeb \
            --name ConexionAzureGit2025090110 \
            --startup-file "node server.js"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ConexionAzureGit2025090110'
          slot-name: 'Production'
          package: './deploy'
